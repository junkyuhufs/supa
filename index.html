<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>영어 단어 객관식 퀴즈</title>
  <!-- Supabase JavaScript v2 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --correct-bg: #dcfce7;
      --correct-border: #16a34a;
      --correct-text: #15803d;
      --wrong-bg: #fee2e2;
      --wrong-border: #dc2626;
      --wrong-text: #b91c1c;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", "맑은 고딕", sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: var(--card);
      width: 100%;
      max-width: 480px;
      padding: 28px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.06);
      border: 1px solid var(--border);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      font-size: 0.9rem;
      color: var(--muted);
    }

    .badge {
      background: #eff6ff;
      color: var(--primary);
      padding: 4px 10px;
      border-radius: 999px;
      font-weight: 600;
    }

    .word-box {
      text-align: center;
      padding: 28px 16px;
      background-color: #f1f5f9;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    .word-box h1 {
      font-size: 2.2rem;
      color: #0f172a;
      letter-spacing: 0.5px;
    }

    .options {
      display: grid;
      gap: 10px;
      margin-bottom: 18px;
    }

    .option-btn {
      width: 100%;
      padding: 14px 16px;
      font-size: 1.05rem;
      text-align: left;
      background-color: var(--card);
      border: 2px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.15s ease;
      color: var(--text);
      font-weight: 500;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--primary);
      background-color: #f8fafc;
    }

    .option-btn:disabled {
      cursor: default;
    }

    .option-btn.correct {
      background-color: var(--correct-bg);
      border-color: var(--correct-border);
      color: var(--correct-text);
      font-weight: 700;
    }

    .option-btn.wrong {
      background-color: var(--wrong-bg);
      border-color: var(--wrong-border);
      color: var(--wrong-text);
      font-weight: 700;
    }

    .feedback {
      min-height: 24px;
      font-weight: 600;
      margin-bottom: 8px;
      text-align: center;
    }

    .save-status {
      min-height: 20px;
      font-size: 0.85rem;
      text-align: center;
      color: var(--muted);
      margin-bottom: 16px;
    }

    .action-btn {
      width: 100%;
      padding: 14px;
      font-size: 1rem;
      font-weight: 600;
      color: #ffffff;
      background-color: var(--primary);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }

    .action-btn:hover {
      background-color: var(--primary-hover);
    }

    .hidden {
      display: none;
    }

    .result-box {
      text-align: center;
      padding: 20px 0;
    }

    .score-text {
      font-size: 2.5rem;
      font-weight: 800;
      color: var(--primary);
      margin: 12px 0 24px;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 퀴즈 진행 화면 -->
    <div id="quiz-screen">
      <div class="header">
        <span id="progress-text" class="badge">문제 1 / 3</span>
        <span id="attempt-display">응시 ID 생성 중...</span>
      </div>

      <div class="word-box">
        <h1 id="english-word">abundant</h1>
      </div>

      <div id="options-container" class="options"></div>

      <div id="feedback-msg" class="feedback"></div>
      <div id="save-status-msg" class="save-status"></div>

      <button id="next-btn" class="action-btn hidden">다음 문제</button>
    </div>

    <!-- 결과 화면 -->
    <div id="result-screen" class="result-box hidden">
      <h2>퀴즈 완료!</h2>
      <p class="score-text" id="final-score">0 / 3점</p>
      <button id="retry-btn" class="action-btn">다시 풀기</button>
    </div>
  </div>

  <script>
    // 1. Supabase 설정 (올바른 위치에 적용 완료)
    const SUPABASE_URL = "https://oyjuzwljdxcsmvfuasxi.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_M18Qnt5IQupf3YvX3S1oiQ_IAKlpDKB";

    let supabaseClient = null;
    try {
      if (
        SUPABASE_URL !== "YOUR_SUPABASE_URL" &&
        SUPABASE_PUBLISHABLE_KEY !== "YOUR_PUBLISHABLE_KEY"
      ) {
        supabaseClient = window.supabase.createClient(
          SUPABASE_URL,
          SUPABASE_PUBLISHABLE_KEY
        );
      }
    } catch (e) {
      console.error("Supabase 클라이언트 초기화 오류:", e);
    }

    // 2. 고정 퀴즈 데이터 (3문항)
    const QUIZ_DATA = [
      {
        question_no: 1,
        english_word: "abundant",
        options: ["조용한", "풍부한", "위험한", "느린"],
        answer: "풍부한"
      },
      {
        question_no: 2,
        english_word: "reluctant",
        options: ["주저하는", "열정적인", "정확한", "부지런한"],
        answer: "주저하는"
      },
      {
        question_no: 3,
        english_word: "brief",
        options: ["강력한", "평범한", "짧은", "불규칙한"],
        answer: "짧은"
      }
    ];

    // 3. 상태 변수
    let attemptId = "";
    let currentIndex = 0;
    let score = 0;
    let questionStartTime = 0;
    let hasAnsweredCurrent = false;

    // DOM 요소
    const quizScreen = document.getElementById("quiz-screen");
    const resultScreen = document.getElementById("result-screen");
    const progressText = document.getElementById("progress-text");
    const attemptDisplay = document.getElementById("attempt-display");
    const englishWordEl = document.getElementById("english-word");
    const optionsContainer = document.getElementById("options-container");
    const feedbackMsg = document.getElementById("feedback-msg");
    const saveStatusMsg = document.getElementById("save-status-msg");
    const nextBtn = document.getElementById("next-btn");
    const finalScoreEl = document.getElementById("final-score");
    const retryBtn = document.getElementById("retry-btn");

    // 4. 퀴즈 시작 및 초기화
    function startQuiz() {
      attemptId = crypto.randomUUID();
      currentIndex = 0;
      score = 0;

      attemptDisplay.textContent = `응시 ID: ${attemptId.slice(0, 8)}...`;
      resultScreen.classList.add("hidden");
      quizScreen.classList.remove("hidden");

      renderQuestion();
    }

    // 5. 문제 화면 렌더링
    function renderQuestion() {
      hasAnsweredCurrent = false;
      const currentQuiz = QUIZ_DATA[currentIndex];

      progressText.textContent = `문제 ${currentQuiz.question_no} / ${QUIZ_DATA.length}`;
      englishWordEl.textContent = currentQuiz.english_word;
      feedbackMsg.textContent = "";
      saveStatusMsg.textContent = "";
      nextBtn.classList.add("hidden");
      optionsContainer.innerHTML = "";

      currentQuiz.options.forEach((optionText) => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.textContent = optionText;
        btn.addEventListener("click", () => handleSelectAnswer(optionText, btn));
        optionsContainer.appendChild(btn);
      });

      // 문제 제시 시점 기록
      questionStartTime = performance.now();
    }

    // 6. 보기 선택 처리 (한 번만 선택 가능)
    async function handleSelectAnswer(chosenAnswer, clickedBtn) {
      if (hasAnsweredCurrent) return;
      hasAnsweredCurrent = true;

      // 응답 시간 계산 (0 이상 정수 보장)
      const elapsed = Math.max(0, Math.round(performance.now() - questionStartTime));
      const currentQuiz = QUIZ_DATA[currentIndex];
      const isCorrect = chosenAnswer === currentQuiz.answer;

      if (isCorrect) {
        score += 1;
      }

      // 모든 보기 버튼 비활성화 및 정오답 스타일 표시
      const allButtons = optionsContainer.querySelectorAll(".option-btn");
      allButtons.forEach((btn) => {
        btn.disabled = true;
        if (btn.textContent === currentQuiz.answer) {
          btn.classList.add("correct");
        } else if (btn === clickedBtn && !isCorrect) {
          btn.classList.add("wrong");
        }
      });

      // 즉시 정오답 피드백 표시
      if (isCorrect) {
        feedbackMsg.textContent = `정답입니다! (${(elapsed / 1000).toFixed(2)}초)`;
        feedbackMsg.style.color = "var(--correct-text)";
      } else {
        feedbackMsg.textContent = `오답입니다. 정답은 '${currentQuiz.answer}'입니다. (${(elapsed / 1000).toFixed(2)}초)`;
        feedbackMsg.style.color = "var(--wrong-text)";
      }

      // 다음 문제 / 결과 보기 버튼 노출 (저장과 무관하게 퀴즈 진행 보장)
      nextBtn.textContent =
        currentIndex < QUIZ_DATA.length - 1 ? "다음 문제" : "결과 보기";
      nextBtn.classList.remove("hidden");

      // Supabase에 INSERT 1회 실행
      await saveAnswerToSupabase({
        attempt_id: attemptId,
        question_no: currentQuiz.question_no,
        english_word: currentQuiz.english_word,
        chosen_answer: chosenAnswer,
        is_correct: isCorrect,
        response_time_ms: elapsed
      });
    }

    // 7. Supabase 저장 함수 (insert만 사용, select 미사용)
    async function saveAnswerToSupabase(payload) {
      if (!supabaseClient) {
        saveStatusMsg.textContent = "⚠️ 저장 실패 (Supabase URL/Key 미설정 - 퀴즈는 계속 진행됩니다)";
        return;
      }

      saveStatusMsg.textContent = "응답 저장 중...";
      try {
        const { error } = await supabaseClient
          .from("quiz_answers")
          .insert(payload);

        if (error) {
          console.error("Supabase INSERT 오류:", error);
          saveStatusMsg.textContent = `⚠️ 저장 실패 (${error.message}) - 퀴즈는 계속됩니다.`;
        } else {
          saveStatusMsg.textContent = "✅ 응답이 데이터베이스에 저장되었습니다.";
        }
      } catch (err) {
        console.error("네트워크 또는 예외 오류:", err);
        saveStatusMsg.textContent = "⚠️ 저장 실패 (네트워크 오류) - 퀴즈는 계속됩니다.";
      }
    }

    // 8. 다음 문제 및 다시 풀기 이벤트
    nextBtn.addEventListener("click", () => {
      if (currentIndex < QUIZ_DATA.length - 1) {
        currentIndex += 1;
        renderQuestion();
      } else {
        quizScreen.classList.add("hidden");
        resultScreen.classList.remove("hidden");
        finalScoreEl.textContent = `${score} / ${QUIZ_DATA.length}점`;
      }
    });

    retryBtn.addEventListener("click", () => {
      startQuiz();
    });

    // 앱 최초 실행
    startQuiz();
  </script>
</body>
</html>
